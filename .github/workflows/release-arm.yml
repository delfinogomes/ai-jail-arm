name: Release ARM64

# Builds Linux aarch64 binaries (tarball + .deb) for every upstream
# akitaonrails/ai-jail release that does not yet have a release here.
# Builds run natively on GitHub's ARM runners (free for public repos), so
# no cross toolchain is involved and upstream's test suite runs on arm64.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (e.g. v3.5.0). Empty = check latest upstream releases."
        required: false
        default: ""
      force:
        description: "Rebuild and re-upload assets even if a release already exists here"
        type: boolean
        default: false
      skip_tests:
        description: "Skip upstream's cargo test run"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-arm64
  cancel-in-progress: false

env:
  UPSTREAM: akitaonrails/ai-jail
  # How many of the newest upstream releases to look at on scheduled runs.
  # Anything in that window missing here gets built (backfill).
  LOOKBACK: "3"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.find.outputs.tags }}
      latest: ${{ steps.find.outputs.latest }}
    steps:
      - name: Find upstream releases missing here
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          latest="$(gh release view -R "$UPSTREAM" --json tagName --jq .tagName)"
          if [ -n "${INPUT_TAG:-}" ]; then
            candidates="$INPUT_TAG"
          else
            candidates="$(gh release list -R "$UPSTREAM" -L "$LOOKBACK" \
              --exclude-drafts --exclude-pre-releases \
              --json tagName --jq '.[].tagName')"
          fi

          todo=()
          for tag in $candidates; do
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::warning::skipping non-semver tag '$tag'"
              continue
            fi
            gh release view "$tag" -R "$UPSTREAM" >/dev/null || {
              echo "::error::upstream release $tag not found"; exit 1;
            }
            if [ "${FORCE:-false}" != "true" ] \
              && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag already released here"
              continue
            fi
            echo "will build $tag"
            todo+=("$tag")
          done

          json="$(printf '%s\n' "${todo[@]+"${todo[@]}"}" | jq -R . | jq -sc 'map(select(length > 0)) | reverse')" # oldest first
          echo "tags=$json" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $latest; to build: $json" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.tags != '[]'
    runs-on: ubuntu-22.04-arm # glibc 2.35, same baseline as upstream's x86_64 build
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.check.outputs.tags) }}
    steps:
      - name: Check out upstream at tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: refs/tags/${{ matrix.tag }}
          path: src
          persist-credentials: false

      - name: Validate version
        working-directory: src
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          cargo_version="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d '"' -f 2)"
          [ "$cargo_version" = "${TAG#v}" ] || {
            echo "Cargo.toml version $cargo_version does not match $TAG" >&2; exit 1;
          }
          git rev-parse HEAD > ../upstream-commit.txt
          echo "Upstream commit: $(cat ../upstream-commit.txt)"

      - name: Install build and sandbox prerequisites
        run: |
          set -eu
          install_prereqs() {
            timeout 300 sudo apt-get update -o Acquire::Retries=3 || return 1
            timeout 300 sudo apt-get install -y -o Acquire::Retries=3 \
              bubblewrap build-essential file || return 1
          }
          for attempt in 1 2 3; do
            install_prereqs && exit 0
            echo "::warning title=apt retry::attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1

      - name: Install Rust toolchain pinned by upstream
        working-directory: src
        run: |
          set -eu
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # Installs the channel from upstream's rust-toolchain.toml
          # (falls back to stable if the file is absent).
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup toolchain install
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          rustc -Vv

      - name: Test
        if: ${{ !inputs.skip_tests }}
        working-directory: src
        run: cargo test --locked --features test-hooks

      - name: Build release binary
        working-directory: src
        run: |
          set -eu
          cargo build --locked --release --target aarch64-unknown-linux-gnu
          bin=target/aarch64-unknown-linux-gnu/release/ai-jail
          file "$bin"
          file "$bin" | grep -q 'ARM aarch64' || { echo "not an aarch64 binary" >&2; exit 1; }
          "$bin" --version

      - name: Archive and checksum
        run: |
          set -eu
          mkdir -p out
          tar czf out/ai-jail-linux-aarch64.tar.gz \
            -C src/target/aarch64-unknown-linux-gnu/release ai-jail
          (cd out && sha256sum ai-jail-linux-aarch64.tar.gz > ai-jail-linux-aarch64.tar.gz.sha256)
          cp upstream-commit.txt out/

      - name: Build Debian package (arm64)
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          script=src/packaging/debian/build-deb.sh
          if [ ! -f "$script" ]; then
            echo "::warning::$TAG has no packaging/debian/build-deb.sh; skipping .deb"
            exit 0
          fi
          # Reuse upstream's packaging script verbatim except for the arch,
          # so control-file changes upstream flow through automatically.
          sed 's/amd64/arm64/g' "$script" > src/packaging/debian/build-deb-arm64.sh
          chmod +x src/packaging/debian/build-deb-arm64.sh
          ./src/packaging/debian/build-deb-arm64.sh "${TAG#v}" \
            src/target/aarch64-unknown-linux-gnu/release/ai-jail out
          deb="out/ai-jail_${TAG#v}_arm64.deb"
          arch="$(dpkg-deb -f "$deb" Architecture)"
          [ "$arch" = arm64 ] || { echo "deb Architecture is '$arch', expected arm64" >&2; exit 1; }
          dpkg-deb -I "$deb"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-${{ matrix.tag }}
          path: out/
          if-no-files-found: error

  release:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.outputs.tags != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1 # publish oldest-first so "Latest" ends up correct
      matrix:
        tag: ${{ fromJSON(needs.check.outputs.tags) }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: arm64-${{ matrix.tag }}
          path: artifacts

      - name: Verify checksums
        working-directory: artifacts
        run: |
          set -eu
          ls -la
          for f in *.sha256; do sha256sum -c "$f"; done

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.deb

      - name: Assemble release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          commit="$(cat artifacts/upstream-commit.txt)"
          version="${TAG#v}"
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          upstream_url="https://github.com/${UPSTREAM}"
          {
            echo "Unofficial **Linux ARM64 (aarch64)** build of [ai-jail ${TAG}](${upstream_url}/releases/tag/${TAG})."
            echo
            echo "Built unmodified from upstream commit [\`${commit:0:12}\`](${upstream_url}/commit/${commit}) on a native \`ubuntu-22.04-arm\` GitHub runner (requires glibc ≥ 2.35)."
            echo "Not affiliated with or endorsed by the upstream project."
            echo
            echo "## Install"
            echo '```bash'
            echo "# Debian/Ubuntu (arm64)"
            echo "curl -LO ${repo_url}/releases/download/${TAG}/ai-jail_${version}_arm64.deb"
            echo "sudo apt install ./ai-jail_${version}_arm64.deb"
            echo
            echo "# Any glibc distro (needs bubblewrap installed)"
            echo "curl -L ${repo_url}/releases/download/${TAG}/ai-jail-linux-aarch64.tar.gz | tar xz"
            echo "sudo install -m 0755 ai-jail /usr/local/bin/ai-jail"
            echo '```'
            echo
            echo "## Verify"
            echo '```bash'
            echo "gh attestation verify ai-jail-linux-aarch64.tar.gz -R ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "## Checksums (SHA256)"
            echo '```'
            cat artifacts/*.sha256
            echo '```'
            echo
            echo "---"
            echo
            echo "## Upstream release notes"
            echo
            gh release view "$TAG" -R "$UPSTREAM" --json body --jq .body
          } > body.md
          cat body.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/*.tar.gz artifacts/*.deb artifacts/*.sha256)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; replacing assets and notes"
            gh release upload "$TAG" "${assets[@]}" -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file body.md
          else
            latest_flag="--latest=false"
            [ "$TAG" = "$LATEST" ] && latest_flag="--latest"
            gh release create "$TAG" "${assets[@]}" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG (arm64)" \
              --notes-file body.md "$latest_flag"
          fi
